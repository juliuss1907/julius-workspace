# Scanning parameters
scan:
  # How many recent tweets to fetch per KOL
  tweets_per_kol: 10
  
  # How many tweets to fetch per keyword search
  tweets_per_keyword: 20
  
  # Minimum engagement to consider a tweet "significant"
  min_engagement: 20  # likes + retweets
  
  # Lookback window (hours)
  max_age_hours: 24
  
  # Maximum number of tweets to analyze before summarizing
  max_tweets_to_analyze: 300

# Output settings
output:
  # Format: "telegram" (for briefs) or "markdown" (for detailed)
  format: "telegram"
  
  # Length limit for output
  max_length_chars: 4000  # Telegram message limit
  
  # Include sections:
  include_narratives: true
  include_kol_insights: true
  include_contrarian_takes: true
  include_emerging_trends: true

# View thresholds per tier for KOL Summary (tweets below threshold are filtered out)
view_thresholds:
  T1: 30000    # Tier 1: only show tweets with >= 30k views
  T2: 5000     # Tier 2: only show tweets with >= 5k views
  T3: 5000     # Tier 3: only show tweets with >= 5k views

# Enable/disable scanning categories
enabled_tiers:
  individuals_tier1: true
  individuals_tier2: true
  individuals_tier3: true
  organizations_crypto: true
  organizations_ai: true

# Quick mode: true = scan limited accounts/keywords for faster runs
quick-mode: false

# Enable/disable keyword categories to scan
enabled_categories:
  evergreen: true
  trending: true

# Sentiment analysis keywords (case-insensitive)
sentiment:
  positive_keywords:
    - "bullish"
    - "optimistic"
    - "buy"
    - "long"
    - "support"
    - "breakout"
    - "accumulate"
    - "undervalued"
    - "opportunity"
    - "growth"
  
  negative_keywords:
    - "bearish"
    - "pessimistic"
    - "sell"
    - "short"
    - "resistance"
    - "breakdown"
    - "overvalued"
    - "bubble"
    - "crash"
    - "decline"
  
  neutral_keywords:
    - "hold"
    - "neutral"
    - "consolidate"
    - "range"
    - "sideways"
    - "wait"
    - "observe"
    - "analysis"
    - "update"
    - "report"
